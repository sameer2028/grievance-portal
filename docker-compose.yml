version: '3.9'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: grievance_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: grievance_secret_2024
      MONGO_INITDB_DATABASE: grievance_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grievance_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:grievance_secret_2024@mongo:27017/grievance_db?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── AI Service ────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: grievance_ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
      ENVIRONMENT: production
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CLASSIFICATION_THRESHOLD: '0.45'
      DUPLICATE_THRESHOLD: '0.88'
      BACKEND_URL: http://backend:5000
    volumes:
      # Cache downloaded models between container restarts
      - ai_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Models take time to download on first start

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grievance_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api

volumes:
  mongo_data:
  ai_model_cache:

networks:
  default:
    name: grievance_network
